# Synthetic fixture for CI. Same table and column names as the real-data load.
# pk / fk / cast describe the tables for staging and tests; the generator ignores them.
seed: 202
tables:
  - name: merchants
    rows: 400
    pk: merchant_id
    columns:
      merchant_id: {type: id, prefix: M}
      segment: {type: choice, values: [smb, mid_market, enterprise], p: [0.7, 0.22, 0.08]}
      country_code: {type: choice, values: [US, CA, AU], p: [0.7, 0.2, 0.1]}
  - name: risk_scores
    grid: {parent: merchants.merchant_id, start: 2025-01-01, end: 2025-06-01, freq: MS, column: score_month}
    pk: [merchant_id, score_month]
    fk: {merchant_id: merchants.merchant_id}
    cast: {score_month: date}
    columns:
      risk_score: {type: float, low: 0, high: 100, decimals: 1}
      model_version: {type: choice, values: [v1]}
  - name: overrides
    rows: 150
    pk: override_id
    fk: {merchant_id: merchants.merchant_id}
    cast: {score_month: date}
    columns:
      override_id: {type: id, prefix: OVR}
      merchant_id: {type: fk, table: merchants, column: merchant_id}
      score_month: {type: expr, expr: "pd.Series(rng.choice(pd.date_range('2025-01-01', '2025-06-01', freq='MS'), n))"}
      proposed_rating: {type: choice, values: [low, medium, high]}
      reason: {type: choice, values: [chargeback_history, new_owner, kyc_refresh, analyst_review]}
      proposed_by: {type: choice, values: [analyst_1, analyst_2, analyst_3]}
      status: {type: choice, values: [approved, pending, rejected], p: [0.6, 0.25, 0.15]}
      approved_by: {type: expr, expr: "pd.Series(np.where(df.status == 'approved', rng.choice(['checker_a', 'checker_b'], n), None))"}
